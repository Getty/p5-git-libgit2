name: macos
on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:
jobs:
  macos:
    runs-on: macos-14
    env:
      # Help FFI::Platypus find Homebrew libs (Apple Silicon path).
      # Job-level so it reaches the composite action's dzil step.
      DYLD_FALLBACK_LIBRARY_PATH: /opt/homebrew/lib:/usr/local/lib
    steps:
      - uses: actions/checkout@v4
      - name: Install Homebrew libgit2
        run: brew install libgit2 pkg-config
      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'
      - name: perl -V
        run: perl -V
      - name: Install Dist::Zilla
        env:
          PERL_CPANM_OPT: --mirror http://cpan.metacpan.org --mirror-only
        run: cpanm -nq Dist::Zilla
      - name: Install Alien::Libgit2
        env:
          PERL_CPANM_OPT: --mirror http://cpan.metacpan.org --mirror-only
          # Fail loudly rather than quietly building the bundled copy if
          # pkg-config cannot see the Homebrew libgit2 installed above.
          ALIEN_INSTALL_TYPE: system
        run: cpanm -nq Alien::Libgit2
      - name: Report the libgit2 under test
        run: |
          perl -MAlien::Libgit2 -e 'printf "install_type=%s version=%s\n",
            Alien::Libgit2->install_type, Alien::Libgit2->version // q(?)'
      - name: dzil test
        uses: Getty/p5-dist-zilla-pluginbundle-author-getty/.github/actions/dzil-test@main
